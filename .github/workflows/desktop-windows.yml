name: Build Windows desktop app
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt pyinstaller socksio
      - name: Fetch bundled FFmpeg and runtimes
        run: python packaging/fetch_windows_tools.py
      - name: Prepare bundled Whisper base.en weights
        run: python packaging/fetch_whisper.py
      - name: Run regression tests
        shell: pwsh
        run: |
          $env:PATH = "$pwd\vendor\bin;$env:PATH"
          $env:PYTHONPATH = "$pwd"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop
        run: pyinstaller --clean --noconfirm AutoShorts.spec
      - name: Test packaged GUI and bundled tools
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist\AutoShorts\AutoShorts.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\AutoShorts\desktop.log" -ErrorAction SilentlyContinue
            throw "Desktop self-test failed"
          }
          if (-not (Select-String -Path "$env:LOCALAPPDATA\AutoShorts\desktop.log" -Pattern "DESKTOP_SELF_TEST_PASSED" -Quiet)) {
            throw "Desktop self-test marker missing"
          }
      - name: Create download
        shell: pwsh
        run: Compress-Archive -Path dist\AutoShorts -DestinationPath AutoShorts-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoShorts-Windows-x64
          path: AutoShorts-Windows-x64.zip
